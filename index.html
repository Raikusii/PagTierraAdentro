<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#050706">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Tierra Adentro - Carta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>



    <header class="header">
        <img src="assets/logo/LogoTA.png" alt="Tierra Adentro" class="header-logo" width="44" height="44" decoding="async">
        <div class="header__content">
            <h1 class="logo">Tierra <span>Adentro</span></h1>
            <p class="subtitle">Elige y Disfruta</p>
            <div class="header__divider" aria-hidden="true"></div>
        </div>
    </header>



    <main class="menu-container" id="menu-productos"></main>



    <div class="product-modal" id="product-modal" aria-hidden="true">
        <div class="product-modal__backdrop" data-close></div>
        <div class="product-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="product-modal__close" type="button" aria-label="Cerrar" data-close>
                <span class="material-symbols-outlined">close</span>
            </button>
            <div class="product-modal__img-wrap">
                <picture>
                    <source id="modal-source-webp" type="image/webp">
                    <img id="modal-img" class="product-modal__img" alt="" width="600" height="400" decoding="async">
                </picture>
            </div>
            <div class="product-modal__info">
                <h2 id="modal-title" class="product-modal__title"></h2>
                <p id="modal-desc" class="product-modal__desc"></p>
                <span id="modal-price" class="product-modal__price"></span>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottom-nav">

        <button class="nav-item active" data-categoria="todos">

            <span class="material-symbols-outlined">apps</span>

            <span class="nav-text">Todos</span>

        </button>

        <button class="nav-item" data-categoria="licores">

            <span class="material-symbols-outlined">local_bar</span>

            <span class="nav-text">Licores</span>

        </button>

        <button class="nav-item" data-categoria="cervezas">

            <span class="material-symbols-outlined">sports_bar</span>

            <span class="nav-text">Cervezas</span>

        </button>

        <button class="nav-item" data-categoria="cocteles">

            <span class="material-symbols-outlined">liquor</span>

            <span class="nav-text">Cócteles</span>

        </button>

        <button class="nav-item" data-categoria="bebidas">

            <span class="material-symbols-outlined">local_drink</span>

            <span class="nav-text">Bebidas</span>

        </button>

        <button class="nav-item" data-categoria="otros">

            <span class="material-symbols-outlined">tapas</span>

            <span class="nav-text">Otros</span>

        </button>

    </nav>

    <aside class="creator-credit" aria-label="Créditos del desarrollador">
        <span class="creator-credit__by">By. Jhoan Escorcia</span> 
    </aside>

    <script src="app.js"></script>

</body>

</html>
